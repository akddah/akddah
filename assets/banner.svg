<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041A33"/>
      <stop offset="55%" stop-color="#02569B"/>
      <stop offset="100%" stop-color="#13B9FD"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <style>
      .font { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .name { font-size: 64px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
      .role { font-size: 26px; font-weight: 600; fill: #9EE6FF; }
      .chipText { font-size: 17px; font-weight: 600; fill: #ffffff; }
      .hello { font-size: 20px; font-weight: 500; fill: #CFEFFF; letter-spacing: 3px; }
      .fade1 { opacity: 0; animation: up .8s ease-out .1s forwards; }
      .fade2 { opacity: 0; animation: up .8s ease-out .35s forwards; }
      .fade3 { opacity: 0; animation: up .8s ease-out .6s forwards; }
      .fade4 { opacity: 0; animation: up .8s ease-out .85s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 8s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- decorative shapes -->
  <g opacity="0.10" fill="#ffffff">
    <circle class="float1" cx="1080" cy="70" r="110"/>
    <circle class="float2" cx="960" cy="280" r="70"/>
  </g>

  <!-- phone outline -->
  <g transform="translate(930 52)"><g class="float1">
    <rect x="0" y="0" width="128" height="226" rx="22" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="48" y="12" width="32" height="6" rx="3" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="16" y="34" width="96" height="44" rx="10" fill="#13B9FD" fill-opacity="0.75"/>
    <rect x="16" y="88" width="44" height="44" rx="10" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="68" y="88" width="44" height="44" rx="10" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="16" y="142" width="96" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="16" y="162" width="70" height="12" rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="16" y="190" width="96" height="22" rx="11" fill="#9EE6FF" fill-opacity="0.8"/>
  </g></g>

  <g class="font">
    <text x="64" y="92" class="hello fade1">HELLO, I'M</text>
    <text x="62" y="160" class="name fade2">Abdallah Osama</text>
    <text x="64" y="204" class="role fade3">Flutter Team Lead  •  Android &amp; iOS Engineer</text>

    <g class="fade4">
      <rect x="64" y="234" width="150" height="40" rx="20" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="139" y="260" class="chipText" text-anchor="middle">6+ years</text>

      <rect x="226" y="234" width="210" height="40" rx="20" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="331" y="260" class="chipText" text-anchor="middle">7 production apps</text>

      <rect x="448" y="234" width="210" height="40" rx="20" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="553" y="260" class="chipText" text-anchor="middle">100K+ downloads</text>
    </g>
  </g>
</svg>
